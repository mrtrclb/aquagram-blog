# Aquagram Blog — blog.aquagram.com.tr
# 15 dakikada bir yayındaki yazıları Supabase'den okuyup statik siteyi derler.
# İçerik değişmediyse yayın atlanır. Veritabanına ulaşılamazsa derleme hata verir ve eski site yayında kalır.
# Derleyici kodu ana depoda (mrtrclb/aquatakas-mvp, blog/ klasörü) durur; bu depo yalnız yayın içindir.
name: Blog yayını

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 3 1 * *"   # ayda bir: depo hareketsiz kalıp zamanlama durmasın diye
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blog-yayin
  cancel-in-progress: false

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      degisti: ${{ steps.onbellek.outputs.cache-hit != 'true' }}
      surum: ${{ steps.surum.outputs.surum }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mrtrclb/aquatakas-mvp
          ref: main
          path: kaynak
          sparse-checkout: |
            blog
            public/favicon.svg
            src/lib/supabase.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bloğu derle
        run: node kaynak/blog/build.mjs site

      - id: surum
        run: echo "surum=$(cat site/surum.txt)" >> "$GITHUB_OUTPUT"

      # Bu sürüm daha önce yayınlandıysa tekrar yayınlama
      - id: onbellek
        uses: actions/cache/restore@v4
        with:
          path: site/surum.txt
          key: blog-surum-${{ steps.surum.outputs.surum }}
          lookup-only: true

      - if: steps.onbellek.outputs.cache-hit != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  yayinla:
    needs: derle
    if: needs.derle.outputs.degisti == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v4
      - run: echo "${{ needs.derle.outputs.surum }}" > surum.txt
      - uses: actions/cache/save@v4
        with:
          path: surum.txt
          key: blog-surum-${{ needs.derle.outputs.surum }}

  canli-tut:
    if: github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          date -u +%Y-%m-%d > .canli
          git add .canli
          git commit -m "Aylık canlı tutma" && git push
